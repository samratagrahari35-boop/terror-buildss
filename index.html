    const Magnet = ({ children, padding = 150, strength = 3, className = "" }) => {
      const ref = useRef(null);
      const [style, setStyle] = useState({});

      const handleMouseMove = (e) => {
        if (!ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const distX = e.clientX - centerX;
        const distY = e.clientY - centerY;
        const distance = Math.hypot(distX, distY);
        const maxDistance = Math.max(rect.width, rect.height) / 2 + padding;

        if (distance < maxDistance) {
          setStyle({
            transform: `translate3d(${distX / strength}px, ${distY / strength}px, 0px)`,
            transition: 'transform 0.3s ease-out',
            willChange: 'transform'
          });
        } else {
          setStyle({
            transform: `translate3d(0px, 0px, 0px)`,
            transition: 'transform 0.6s ease-in-out',
            willChange: 'transform'
          });
        }
      };

      useEffect(() => {
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, [padding, strength]);

      return (
        <div ref={ref} style={style} className={className}>
          {children}
        </div>
      );
    };

    const CharSpan = ({ char, range, progress }) => {

    const AnimatedText = ({ text }) => {
      const containerRef = useRef(null);
      const { scrollYProgress } = useScroll({
        target: containerRef,
        offset: ['start 0.8', 'end 0.2']
      });

      const words = text.split(" ");
      let totalChars = 0;
      const wordCharOffsets = words.map(w => {
        const offset = totalChars;
        totalChars += w.length + 1;
        return offset;
      });

      return (
        <p ref={containerRef} className="text-[#E0E0E0] font-medium text-center leading-relaxed max-w-[560px] text-[clamp(1rem,2vw,1.35rem)] flex flex-wrap justify-center gap-[0.25em]">
          {words.map((word, wIdx) => {
            const startOffset = wordCharOffsets[wIdx];
            return (
              <span key={wIdx} className="inline-block whitespace-nowrap">
                {word.split("").map((char, cIdx) => {
                  const charIndex = startOffset + cIdx;
                  const start = charIndex / totalChars;
                  const end = (charIndex + 1) / totalChars;
                  return <CharSpan key={cIdx} char={char} range={[start, end]} progress={scrollYProgress} />;
                })}
              </span>
            );
          })}
        </p>
      );
    };

        <div className="w-full flex justify-between items-end pb-7 sm:pb-8 md:pb-10 z-20">
          <FadeIn delay={0.35} y={20}>
            <p className="text-neutral-300 font-light uppercase tracking-wide leading-snug text-[clamp(0.75rem,1.4vw,1.5rem)] max-w-[160px] sm:max-w-[220px] md:max-w-[260px]">
              A digital creator & agency powerhouse building high-impact brands
            </p>
          </FadeIn>
          <FadeIn delay={0.5} y={20}>
            <ContactButton onClick={onOpenContact} />
          </FadeIn>
        </div>
      </section>
    );

    const MarqueeSection = () => {
      const sectionRef = useRef(null);
      const [offset, setOffset] = useState(0);

      useEffect(() => {
        const handleScroll = () => {
          if (!sectionRef.current) return;
          const rect = sectionRef.current.getBoundingClientRect();
          const top = rect.top + window.scrollY;
          const scrollPos = (window.scrollY - top + window.innerHeight) * 0.3;
          setOffset(scrollPos);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const row1 = [...MARQUEE_IMAGES_ROW1, ...MARQUEE_IMAGES_ROW1, ...MARQUEE_IMAGES_ROW1];
      const row2 = [...MARQUEE_IMAGES_ROW2, ...MARQUEE_IMAGES_ROW2, ...MARQUEE_IMAGES_ROW2];

      return (
        <section ref={sectionRef} className="bg-[#0A0A0A] pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden w-full relative">
          <div className="flex flex-col gap-3">
            <div className="flex gap-3 w-max" style={{ transform: `translateX(${offset - 200}px)`, willChange: 'transform' }}>
              {row1.map((src, idx) => (
                <img key={`r1-${idx}`} src={src} alt="preview" className="w-[420px] h-[270px] rounded-2xl object-cover shrink-0 bg-[#141414] border border-[#FF6600]/20" />
              ))}
            </div>
            <div className="flex gap-3 w-max" style={{ transform: `translateX(${-(offset - 200)}px)`, willChange: 'transform' }}>
              {row2.map((src, idx) => (
                <img key={`r2-${idx}`} src={src} alt="preview" className="w-[420px] h-[270px] rounded-2xl object-cover shrink-0 bg-[#141414] border border-[#FF6600]/20" />
              ))}
            </div>
          </div>
        </section>
      );
    };

    const AboutSection = ({ onOpenContact }) => (
      <section id="about" className="relative min-h-screen w-full flex flex-col justify-center items-center px-5 sm:px-8 md:px-10 py-20 bg-[#0A0A0A] overflow-hidden">
        <FadeIn delay={0.1} x={-80} y={0} duration={0.9} className="absolute top-[4%] left-[1%] sm:left-[2%] md:left-[4%] z-10 pointer-events-none opacity-60">
          <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png" className="w-[120px] sm:w-[160px] md:w-[210px] object-contain" alt="3D object" />
        </FadeIn>
        <FadeIn delay={0.25} x={-80} y={0} duration={0.9} className="absolute bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%] z-10 pointer-events-none opacity-60">
          <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png" className="w-[100px] sm:w-[140px] md:w-[180px] object-contain" alt="3D object" />
        </FadeIn>
        <FadeIn delay={0.15} x={80} y={0} duration={0.9} className="absolute top-[4%] right-[1%] sm:right-[2%] md:right-[4%] z-10 pointer-events-none opacity-60">
          <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png" className="w-[120px] sm:w-[160px] md:w-[210px] object-contain" alt="3D object" />
        </FadeIn>
        <FadeIn delay={0.3} x={80} y={0} duration={0.9} className="absolute bottom-[8%] right-[3%] sm:right-[6%] md:right-[10%] z-10 pointer-events-none opacity-60">
          <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png" className="w-[130px] sm:w-[170px] md:w-[220px] object-contain" alt="3D object" />
        </FadeIn>

        <div className="flex flex-col items-center z-20 max-w-4xl mx-auto gap-10 sm:gap-14 md:gap-16">
          <FadeIn delay={0} y={40}>
            <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center text-[clamp(3rem,12vw,160px)]">About me</h2>
          </FadeIn>
          <AnimatedText text="I am Samrat, a creator and digital service provider specializing in modern front-end web design, viral video editing, high-CTR thumbnail crafting, and social media brand management. I help businesses and creators scale their digital presence with undeniable visual style." />
          <div className="mt-6 sm:mt-8 md:mt-10">
            <ContactButton onClick={onOpenContact} />
          </div>
        </div>
      </section>
    );

    const ServicesSection = () => (
      <section id="services" className="bg-[#050505] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] border-t-2 border-[#FF6600]/30 px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32 relative z-20">
        <div className="max-w-5xl mx-auto">
          <h2 className="orange-gradient-text font-black uppercase text-center text-[clamp(3rem,12vw,160px)] leading-none tracking-tight mb-16 sm:mb-20 md:mb-28">
            Services
          </h2>
          <div className="flex flex-col">
            {NEW_SERVICES.map((item, idx) => (
              <FadeIn key={idx} delay={idx * 0.1} y={30}>
                <div className="py-8 sm:py-10 md:py-12 border-b border-[#FF6600]/20 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 md:gap-12 group hover:border-[#FF6600]/60 transition-colors">
                  <span className="font-black text-[#FF6600] text-[clamp(3rem,10vw,140px)] leading-none font-sans group-hover:scale-105 transition-transform">
                    {item.num}
                  </span>
                  <div className="flex flex-col gap-2 max-w-2xl">
                    <h3 className="font-bold uppercase text-white text-[clamp(1.2rem,2.5vw,2.2rem)] tracking-wide group-hover:text-[#FF8A00] transition-colors">
                      {item.title}
                    </h3>
                    <p className="font-light leading-relaxed text-neutral-400 text-[clamp(0.85rem,1.6vw,1.15rem)]">
                      {item.desc}
                    </p>
                  </div>
                </div>
              </FadeIn>
            ))}
          </div>
        </div>
      </section>
    );

    const ProjectsSection = () => (
      <section id="projects" className="bg-[#0A0A0A] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 pt-16 sm:pt-20 md:pt-24 pb-32 px-5 sm:px-8 md:px-10 relative z-30">
        <div className="max-w-6xl mx-auto mb-12 sm:mb-16 md:mb-20 text-center">
          <FadeIn delay={0} y={40}>
            <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-[clamp(3rem,12vw,160px)]">Projects</h2>
          </FadeIn>
        </div>
        <div className="relative flex flex-col gap-10">
          {PROJECTS.map((project, idx) => (
            <ProjectCard key={idx} project={project} index={idx} totalCards={PROJECTS.length} />
          ))}
        </div>
      </section>
    );

    // ==========================================
    // MAIN APP
    // ==========================================
    function App() {
      const [isContactOpen, setIsContactOpen] = useState(false);

      return (
        <main className="bg-[#0A0A0A] text-white min-h-screen w-full font-['Kanit',sans-serif] overflow-x-clip">
          <HeroSection onOpenContact={() => setIsContactOpen(true)} />
          <MarqueeSection />
          <AboutSection onOpenContact={() => setIsContactOpen(true)} />
          <ServicesSection />
          <ProjectsSection />
          <ContactModal isOpen={isContactOpen} onClose={() => setIsContactOpen(false)} />
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
