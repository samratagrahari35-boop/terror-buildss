<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEX, Forma & Convix - Integrated Experience</title>

  <!-- Google Fonts: Inter & Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Instrument Serif', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <style>
    * {
      font-family: 'Inter', sans-serif;
    }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
    }

    /* Page 1: Liquid Glass */
    .liquid-glass {
      background: rgba(0, 0, 0, 0.4);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.1) 80%, rgba(255,255,255,0.3) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Transitions & Animations */
    .modal-enter {
      animation: modalFadeIn 0.3s ease-out forwards;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // HELPER / SHARED COMPONENTS
    // ==========================================

    const FadeIn = ({ delay, duration, children, className = '' }) => {
      const [show, setShow] = useState(false);
      useEffect(() => {
        const timer = setTimeout(() => setShow(true), delay);
        return () => clearTimeout(timer);
      }, [delay]);
      return (
        <div 
          className={`transition-opacity ${className}`} 
          style={{ opacity: show ? 1 : 0, transitionDuration: `${duration}ms` }}
        >
          {children}
        </div>
      );
    };

    // ==========================================
    // PAGE 1: VEX HERO & SIGN IN
    // ==========================================

    const AnimatedHeading = ({ text }) => {
      const [startAnim, setStartAnim] = useState(false);
      useEffect(() => {
        const timer = setTimeout(() => setStartAnim(true), 200);
        return () => clearTimeout(timer);
      }, []);

      const lines = text.split('\n');
      return (
        <h1 className="text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-normal mb-4" style={{ letterSpacing: '-0.04em' }}>
          {lines.map((line, lineIndex) => (
            <div key={lineIndex} className="block">
              {line.split('').map((char, charIndex) => {
                const delay = (lineIndex * line.length * 30) + (charIndex * 30);
                return (
                  <span
                    key={charIndex}
                    className="inline-block"
                    style={{
                      opacity: startAnim ? 1 : 0,
                      transform: startAnim ? 'translateX(0)' : 'translateX(-18px)',
                      transition: 'opacity 500ms ease-out, transform 500ms ease-out',
                      transitionDelay: `${delay}ms`
                    }}
                  >
                    {char === ' ' ? '\u00A0' : char}
                  </span>
                );
              })}
            </div>
          ))}
        </h1>
      );
    };

    const SignInModal = ({ isOpen, onClose, onSignInSuccess }) => {
      if (!isOpen) return null;
      
      const handleSignIn = (e) => {
        e.preventDefault();
        onSignInSuccess();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div className="absolute inset-0" onClick={onClose}></div>
          <div className="liquid-glass rounded-2xl w-full max-w-md p-8 relative z-10 modal-enter border border-white/20 text-white">
            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <h2 className="text-2xl font-semibold mb-2">Welcome Back</h2>
            <p className="text-gray-300 text-sm mb-6">Sign in to continue.</p>

            <div className="flex flex-col gap-3">
              <button onClick={handleSignIn} className="flex items-center justify-center w-full gap-3 bg-white text-black py-3 px-4 rounded-lg font-medium hover:bg-gray-100 transition-colors">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Sign in with Google
              </button>
              <button onClick={handleSignIn} className="flex items-center justify-center w-full gap-3 bg-black text-white border border-white/20 py-3 px-4 rounded-lg font-medium hover:bg-white/5 transition-colors">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12c0-5.523-4.477-10-10-10z"/></svg>
                Sign in with Apple
              </button>
            </div>

            <div className="flex items-center gap-3 my-6">
              <div className="flex-1 h-px bg-white/10"></div>
              <span className="text-gray-400 text-xs uppercase">Or continue with</span>
              <div className="flex-1 h-px bg-white/10"></div>
            </div>

            <form onSubmit={handleSignIn} className="flex flex-col gap-3">
              <input type="email" placeholder="Enter your email" className="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-white/30" />
              <button type="submit" className="w-full bg-white text-black py-3 rounded-lg font-medium hover:bg-gray-100 transition-colors">Sign in with Email</button>
            </form>
          </div>
        </div>
      );
    };

    const VexLanding = ({ onSignInSuccess }) => {
      const [isSignInOpen, setIsSignInOpen] = useState(false);
      return (
        <div className="relative w-full h-screen overflow-hidden bg-black text-white">
          <video autoPlay loop muted playsInline className="absolute inset-0 w-full h-full object-cover z-0" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260403_050628_c4e32401-fab4-4a27-b7a8-6e9291cd5959.mp4" />
          <div className="relative z-10 w-full h-full flex flex-col pointer-events-none">
            <div className="px-6 md:px-12 lg:px-16 pt-6 pointer-events-auto">
              <nav className="liquid-glass rounded-xl px-4 py-2 flex items-center justify-between">
                <div className="text-2xl font-semibold tracking-tight text-white">VEX</div>
                <div className="hidden md:flex items-center gap-8 text-sm text-white">
                  <a href="#" className="hover:text-gray-300 transition-colors">Story</a>
                  <a href="#" className="hover:text-gray-300 transition-colors">Investing</a>
                  <a href="#" className="hover:text-gray-300 transition-colors">Building</a>
                  <a href="#" className="hover:text-gray-300 transition-colors">Advisory</a>
                </div>
                <button onClick={() => setIsSignInOpen(true)} className="bg-white text-black px-6 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors">Sign In</button>
              </nav>
            </div>
            <div className="px-6 md:px-12 lg:px-16 pb-12 lg:pb-16 flex-1 flex flex-col justify-end pointer-events-auto">
              <div className="lg:grid lg:grid-cols-2 lg:items-end">
                <div>
                  <AnimatedHeading text={"Shaping tomorrow\nwith vision and action."} />
                  <FadeIn delay={800} duration={1000}>
                    <p className="text-base md:text-lg text-gray-300 mb-5">We back visionaries and craft ventures that define what comes next.</p>
                  </FadeIn>
                  <FadeIn delay={1200} duration={1000} className="flex flex-wrap gap-4">
                    <button onClick={() => setIsSignInOpen(true)} className="bg-white text-black px-8 py-3 rounded-lg font-medium hover:bg-gray-100 transition-colors">Sign In</button>
                    <button onClick={() => setIsSignInOpen(true)} className="liquid-glass border border-white/20 text-white px-8 py-3 rounded-lg font-medium hover:bg-white hover:text-black transition-colors duration-300">Explore Now</button>
                  </FadeIn>
                </div>
                <FadeIn delay={1400} duration={1000} className="mt-8 lg:mt-0 flex items-end justify-start lg:justify-end text-white">
                  <div className="liquid-glass border border-white/20 px-6 py-3 rounded-xl">
                    <span className="text-lg md:text-xl lg:text-2xl font-light">Investing. Building. Advisory.</span>
                  </div>
                </FadeIn>
              </div>
            </div>
          </div>
          <SignInModal isOpen={isSignInOpen} onClose={() => setIsSignInOpen(false)} onSignInSuccess={onSignInSuccess} />
        </div>
      );
    };

    // ==========================================
    // PAGE 2: FORMA DASHBOARD / CONTACT PAGE
    // ==========================================

    const SERVICES = ['Website', 'Mobile App', 'Web App', 'E-Commerce', 'Visual Identity', '3D & Motion', 'Digital Marketing', 'Growth & Consulting', 'Other'];

    const SocialBtn = ({ icon, className }) => (
      <button type="button" className={`w-8 h-8 rounded-xl flex items-center justify-center hover:opacity-80 transition-opacity ${className}`}>
        {icon}
      </button>
    );

    const FormaDashboard = ({ onGoUnlimited }) => {
      const [selectedTags, setSelectedTags] = useState([]);
      const [sending, setSending] = useState(false);
      const [sent, setSent] = useState(false);

      const toggleTag = (tag) => {
        if (selectedTags.includes(tag)) {
          setSelectedTags(selectedTags.filter(t => t !== tag));
        } else {
          setSelectedTags([...selectedTags, tag]);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSending(true);
        await new Promise(r => setTimeout(r, 1000));
        setSending(false);
        setSent(true);
      };

      const IconTwitter = <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>;
      const IconCircle = <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>;
      const IconInstagram = <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>;
      const IconLinkedin = <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>;

      return (
        <div className="min-h-screen bg-white p-3 sm:p-4 md:p-6 text-black">
          <div className="relative rounded-2xl sm:rounded-3xl overflow-hidden min-h-[calc(100vh-24px)] sm:min-h-[calc(100vh-32px)] md:min-h-[calc(100vh-48px)] lg:h-[calc(100vh-48px)] shadow-2xl">
            <video autoPlay muted loop playsInline className="absolute inset-0 w-full h-full object-cover z-0" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260602_150901_c45b90ec-18d7-42ff-90e2-b95d7109e330.mp4" />

            <div className="relative z-10 flex flex-col min-h-[calc(100vh-24px)] sm:min-h-[calc(100vh-32px)] md:min-h-[calc(100vh-48px)] lg:h-full p-4 sm:p-6 md:p-8 gap-6 modal-enter">
              
              {/* Navbar */}
              <nav className="bg-white/60 backdrop-blur-md rounded-2xl shadow-sm pl-3 sm:pl-4 pr-2 py-2 w-full sm:w-auto flex items-center gap-3 sm:gap-6 self-start">
                <svg width="32" height="32" viewBox="0 0 256 256" fill="black" className="shrink-0">
                  <path d="M 256 256 L 128 256 L 0 128 L 128 128 Z M 256 128 L 128 128 L 0 0 L 128 0 Z" />
                </svg>
                <div className="hidden sm:flex items-center gap-6">
                  <a href="#" className="text-gray-800 text-sm font-medium hover:opacity-60 transition-opacity whitespace-nowrap">Our story</a>
                  <a href="#" className="text-gray-800 text-sm font-medium hover:opacity-60 transition-opacity whitespace-nowrap">Expertise</a>
                  <a href="#" className="text-gray-800 text-sm font-medium hover:opacity-60 transition-opacity whitespace-nowrap">Our work</a>
                  <a href="#" className="text-gray-800 text-sm font-medium hover:opacity-60 transition-opacity whitespace-nowrap">Journal</a>
                </div>
                
                <div className="ml-auto sm:ml-0 flex items-center gap-2">
                  <button onClick={onGoUnlimited} className="bg-[#ef4d23] text-white text-sm font-medium px-4 py-2 rounded-xl hover:opacity-90 transition-opacity">
                    Go Unlimited 🚀
                  </button>
                  <button onClick={onGoUnlimited} className="bg-black text-white text-sm font-medium px-4 sm:px-5 py-2 rounded-xl hover:bg-gray-800 transition-colors">
                    Start a project
                  </button>
                </div>
              </nav>

              <div className="flex-1 min-h-[2rem]" />

              <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6">
                <p className="text-white text-3xl sm:text-4xl xl:text-5xl font-medium leading-tight drop-shadow-lg lg:max-w-lg xl:max-w-2xl shrink-0">
                  We craft bold ideas <br />
                  and ship them as <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: 'italic', fontWeight: 400 }}>products</span>
                </p>

                <div className="w-full lg:w-[min(480px,45%)] shrink-0 bg-white rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden p-4 sm:p-6 flex flex-col gap-4">
                  {sent ? (
                    <div className="flex flex-col items-center justify-center py-6 gap-3 text-center modal-enter">
                      <div className="w-12 h-12 rounded-full bg-green-50 flex items-center justify-center text-green-600 text-xl font-bold">✓</div>
                      <h3 className="text-base font-semibold text-gray-900 mt-2">You're all set!</h3>
                      <p className="text-sm text-gray-500">Expect a reply within 24 hours.</p>
                      <button onClick={onGoUnlimited} className="mt-2 bg-[#ef4d23] text-white text-sm font-semibold py-2 px-6 rounded-xl hover:opacity-90 transition-opacity">
                        Go to Convix SaaS Dashboard
                      </button>
                    </div>
                  ) : (
                    <>
                      <h2 className="text-xl sm:text-2xl font-semibold text-black tracking-tight">Say hello! 👋</h2>
                      
                      <div className="flex flex-row items-center justify-between gap-3 bg-gray-50 rounded-2xl px-4 py-2.5">
                        <div className="flex flex-col sm:flex-row sm:items-center sm:gap-2 overflow-hidden">
                          <span className="text-xs text-gray-500 shrink-0">Drop us a line</span>
                          <a href="mailto:hello@forma.co" className="text-blue-600 font-semibold hover:underline truncate text-sm">hello@forma.co</a>
                        </div>
                        <div className="flex items-center gap-1 shrink-0">
                          <SocialBtn icon={IconTwitter} className="bg-gray-100 text-gray-800" />
                          <SocialBtn icon={IconCircle} className="bg-pink-100 text-pink-500" />
                          <SocialBtn icon={IconInstagram} className="bg-orange-100 text-orange-400" />
                          <SocialBtn icon={IconLinkedin} className="bg-blue-100 text-blue-600" />
                        </div>
                      </div>

                      <div className="flex items-center gap-3">
                        <div className="flex-1 h-px bg-gray-200"></div>
                        <span className="text-gray-400 font-medium text-sm">OR</span>
                        <div className="flex-1 h-px bg-gray-200"></div>
                      </div>

                      <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                        <label className="text-sm font-medium text-black">Tell us about your vision</label>
                        
                        <div className="flex flex-col sm:flex-row gap-2">
                          <input required type="text" placeholder="Full name" className="flex-1 min-w-0 text-sm px-3 py-2.5 rounded-xl border border-gray-200 bg-transparent placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition" />
                          <input required type="email" placeholder="Email" className="flex-1 min-w-0 text-sm px-3 py-2.5 rounded-xl border border-gray-200 bg-transparent placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition" />
                        </div>
                        
                        <textarea required rows="4" placeholder="What are you looking to build or improve..." className="w-full text-sm px-3 py-2.5 rounded-xl border border-gray-200 bg-transparent placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition resize-none"></textarea>
                        
                        <div>
                          <label className="text-xs font-medium text-gray-500 block mb-2">I need help with...</label>
                          <div className="flex flex-wrap gap-1.5">
                            {SERVICES.map(tag => (
                              <button 
                                key={tag} 
                                type="button" 
                                onClick={() => toggleTag(tag)}
                                className={`text-xs font-medium px-3 py-2 rounded-lg border transition-all ${
                                  selectedTags.includes(tag) 
                                  ? 'bg-gray-100 text-black border-black' 
                                  : 'bg-white text-gray-700 border-gray-200 hover:border-gray-400'
                                }`}
                              >
                                {tag}
                              </button>
                            ))}
                          </div>
                        </div>

                        <button 
                          type="submit" 
                          disabled={sending}
                          className="w-full bg-black text-white text-sm font-semibold py-3 mt-2 rounded-2xl hover:bg-gray-800 transition-colors disabled:opacity-60"
                        >
                          {sending ? 'Sending...' : 'Send my message'}
                        </button>
                      </form>
                    </>
                  )}
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // PAGE 3: CONVIX SOFTWARE SAAS HERO & DASHBOARD
    // ==========================================

    const Gauge = ({ value, color = "#ef4d23", showLabels = false, min = "0", max = "100" }) => {
      const activeTicks = Math.round((value / 100) * 40);
      const ticks = [];
      const cx = 100, cy = 100, r = 80;

      for (let i = 0; i < 40; i++) {
        const angle = Math.PI + (i / 39) * Math.PI;
        const x1 = cx + (r - 10) * Math.cos(angle);
        const y1 = cy + (r - 10) * Math.sin(angle);
        const x2 = cx + r * Math.cos(angle);
        const y2 = cy + r * Math.sin(angle);
        const isActive = i < activeTicks;

        ticks.push(
          <line
            key={i}
            x1={x1}
            y1={y1}
            x2={x2}
            y2={y2}
            stroke={isActive ? color : '#d4d4d8'}
            strokeWidth="2.5"
            strokeLinecap="round"
          />
        );
      }

      return (
        <div className="w-full max-w-[260px] mx-auto flex flex-col items-center">
          <svg viewBox="0 0 200 120" className="w-full">
            {ticks}
            <text x="100" y="102" textAnchor="middle" fill="#000" fontSize="22" fontWeight="600">
              {value}%
            </text>
          </svg>
          {showLabels && (
            <div className="w-full flex justify-between text-[11px] text-neutral-500 -mt-2 px-4">
              <span>{min}</span>
              <span>{max}</span>
            </div>
          )}
        </div>
      );
    };

    const ConvixSaaS = () => {
      const [menuOpen, setMenuOpen] = useState(false);

      const IconFlower = (
        <svg viewBox="0 0 32 32" className="w-7 h-7 sm:w-8 sm:h-8 shrink-0">
          {[0, 45, 90, 135, 180, 225, 270, 315].map((deg, idx) => {
            const rad = (deg * Math.PI) / 180;
            const cx = 16 + 10 * Math.cos(rad);
            const cy = 16 + 10 * Math.sin(rad);
            return <circle key={idx} cx={cx} cy={cy} r="3.5" fill="#ef4d23" />;
          })}
          <circle cx="16" cy="16" r="3.5" fill="#ef4d23" />
        </svg>
      );

      const IconChevronDown = <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>;
      const IconChevronRight = <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>;
      const IconShoppingCart = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>;
      const IconMenu = <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
      const IconX = <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
      const IconTrendingDown = <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>;
      const IconTrendingUp = <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;

      return (
        <div className="min-h-screen w-full bg-[#ededed] p-3 sm:p-4 text-black modal-enter">
          <div className="relative w-full h-[calc(100vh-24px)] sm:h-[calc(100vh-32px)] overflow-hidden bg-[#d9d9d9] rounded-2xl sm:rounded-3xl">
            
            {/* Background Video with Poster Fallback */}
            <video 
              autoPlay loop muted playsInline 
              preload="auto" 
              disableRemotePlayback 
              poster="https://images.unsplash.com/photo-1557683316-973673baf926?w=1600&q=60"
              className="absolute inset-0 w-full h-full object-cover pointer-events-none" 
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260424_064411_9e9d7f84-9277-41f4-ab10-59172d89e6be.mp4" 
            />
            
            {/* White Overlay */}
            <div className="absolute inset-0 bg-white/10 pointer-events-none" />

            {/* Foreground Content Wrapper */}
            <div className="relative z-10 flex flex-col h-full overflow-y-auto">
              
              {/* Navbar */}
              <div className="flex justify-center pt-4 sm:pt-6 px-3 sm:px-4">
                <div className="bg-white rounded-full shadow-sm border border-neutral-200 pl-2 pr-2 py-2 w-full max-w-[760px] relative flex items-center">
                  
                  {IconFlower}

                  <div className="hidden md:flex items-center gap-6 text-[14px] ml-6 font-medium">
                    <a href="#" className="flex items-center gap-1.5 text-black">
                      <span className="w-1.5 h-1.5 rounded-full bg-black"></span>
                      Home
                    </a>
                    <a href="#" className="text-neutral-600 hover:text-black transition-colors">Features</a>
                    <a href="#" className="text-neutral-600 hover:text-black transition-colors">About</a>
                    <a href="#" className="flex items-center gap-1 text-[#ef4d23]">
                      Pages {IconChevronDown}
                    </a>
                  </div>

                  <div className="ml-auto flex items-center gap-2 sm:gap-3">
                    <button className="hidden sm:flex items-center justify-center p-2 text-neutral-700 hover:text-black">
                      {IconShoppingCart}
                    </button>

                    <button className="bg-[#ef4d23] text-white rounded-full pl-4 pr-1.5 py-1.5 text-xs sm:text-sm font-medium flex items-center gap-2 hover:opacity-90 transition-opacity">
                      <span className="hidden sm:inline">Get early access</span>
                      <span className="sm:hidden">Early access</span>
                      <span className="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center">
                        {IconChevronRight}
                      </span>
                    </button>

                    <button onClick={() => setMenuOpen(!menuOpen)} className="md:hidden p-2 text-neutral-800">
                      {menuOpen ? IconX : IconMenu}
                    </button>
                  </div>

                  {/* Mobile Menu Dropdown */}
                  {menuOpen && (
                    <div className="absolute top-full left-2 right-2 mt-2 bg-white rounded-2xl shadow-lg border border-neutral-200 p-4 z-20 flex flex-col gap-3 md:hidden">
                      <a href="#" className="font-semibold text-black">Home</a>
                      <a href="#" className="text-neutral-600">Features</a>
                      <a href="#" className="text-neutral-600">About</a>
                      <a href="#" className="text-[#ef4d23] flex items-center gap-1">Pages {IconChevronDown}</a>
                    </div>
                  )}

              </div>

              <div className="flex flex-col items-center px-4 pt-10 sm:pt-16 pb-8 sm:pb-12 text-center">
                <div className="inline-flex items-center gap-2 bg-white rounded-full px-4 py-1.5 shadow-sm text-[13px] font-medium text-neutral-800">
                  <span className="w-2 h-2 rounded-full bg-[#ef4d23]"></span>
                  Convix Software
                </div>

                <h1 className="mt-5 sm:mt-6 max-w-4xl text-black" style={{ fontSize: 'clamp(36px, 8vw, 72px)', lineHeight: 1.05, fontWeight: 500, letterSpacing: '-0.02em' }}>
                  Shaping <span style={{ fontFamily: "'Instrument Serif', serif", fontStyle: 'italic', fontWeight: 400 }}>Agencies</span> <br />
                  of tomorrow
                </h1>

                <p className="mt-4 sm:mt-6 text-neutral-700 px-2" style={{ fontSize: 'clamp(13px, 3.5vw, 16px)' }}>
                  The All-In-One Software Powering the Future of PR Agencies
                </p>

                <button className="mt-6 sm:mt-8 inline-flex items-center gap-3 bg-[#0b0f1a] text-white rounded-full pl-6 sm:pl-7 pr-2 py-2 sm:py-2.5 text-[14px] font-medium hover:bg-black transition-colors">
                  Get Started
                  <span className="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-white/15 flex items-center justify-center">
                    {IconChevronRight}
                  </span>
                </button>
              </div>

              {/* Dashboard Preview */}
              <div className="px-3 sm:px-4 pb-12 w-full">
                <div className="bg-[#f5f2ee] rounded-3xl p-4 sm:p-6 w-full max-w-[880px] mx-auto shadow-sm">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
                    
                    {/* Card 1 — Clicks */}
                    <div className="bg-white rounded-2xl p-5 flex flex-col justify-between shadow-xs">
                      <div>
                        <div className="flex justify-between items-center text-[13px]">
                          <span className="text-[#ef4d23] font-semibold">Clicks</span>
                          <span className="text-neutral-500">This Month</span>
                        </div>
                        <div className="flex items-baseline gap-2 mt-3">
                          <span className="text-[28px] font-semibold text-black">6,896</span>
                          <span className="inline-flex items-center gap-1 bg-red-50 text-red-600 rounded-full px-2 py-0.5 text-[11px] font-medium">
                            {IconTrendingDown} -3,382 (33%)
                          </span>
                        </div>
                        <p className="text-[11px] text-neutral-400 mt-1">Compared to yesterday</p>
                      </div>

                      <div className="mt-4">
                        <p className="text-center text-xs font-medium text-neutral-600 mb-1">Month Target achieved</p>
                        <Gauge value={92} color="#ef4d23" showLabels={true} min="389K" max="425K" />
                      </div>

                      <div className="bg-neutral-100 rounded-full p-1 flex mt-4 text-xs font-medium">
                        <button className="flex-1 bg-white rounded-full py-1 text-center shadow-xs text-black">Impressions</button>
                        <button className="flex-1 text-neutral-500 py-1 text-center">Clicks</button>
                      </div>
                    </div>

                    {/* Card 2 — Form */}
                    <div className="bg-white rounded-2xl p-5 flex flex-col gap-3 shadow-xs">
                      <div>
                        <label className="text-[12px] text-neutral-700 block mb-1">Show figures for</label>
                        <button className="w-full flex items-center justify-between border border-neutral-200 rounded-lg px-3 py-2 text-xs font-medium text-black">
                          This month {IconChevronDown}
                        </button>
                      </div>

                      <div>
                        <label className="text-[12px] text-neutral-700 block mb-1">Compare period by</label>
                        <button className="w-full flex items-center justify-between border border-neutral-200 rounded-lg px-3 py-2 text-xs font-medium text-black">
                          Month-to-date (MTD) {IconChevronDown}
                        </button>
                      </div>

                      <div>
                        <label className="text-[12px] text-neutral-700 block mb-1">Ste targets (This month)</label>
                        <div className="flex items-center border border-neutral-200 rounded-lg px-3 py-2 text-xs">
                          <span className="text-neutral-400 mr-1">#</span>
                          <input type="text" defaultValue="10" className="w-full bg-transparent focus:outline-none text-black font-medium" />
                        </div>
                      </div>

                      <div>
                        <label className="text-[12px] text-neutral-700 block mb-1">Ste targets (This year)</label>
                        <div className="flex items-center border border-neutral-200 rounded-lg px-3 py-2 text-xs">
                          <span className="text-neutral-400 mr-1">#</span>
                          <input type="text" defaultValue="100" className="w-full bg-transparent focus:outline-none text-black font-medium" />
                        </div>
                      </div>

                      <div className="flex items-center gap-3 mt-1">
                        <button className="bg-[#ef4d23] text-white rounded-lg px-5 py-2 text-xs font-medium hover:opacity-90">Save</button>
                        <button className="text-xs text-neutral-500 underline">Cancel</button>
                        <button className="ml-auto text-neutral-400 hover:text-black">{IconX}</button>
                      </div>
                    </div>

                    {/* Card 3 — Video Starts */}
                    <div className="bg-white rounded-2xl p-5 flex flex-col justify-between shadow-xs">
                      <div>
                        <div className="flex justify-between items-center text-[13px]">
                          <span className="text-[#ef4d23] font-semibold">Video Starts</span>
                          <span className="text-neutral-500">today</span>
                        </div>
                        <div className="flex items-baseline gap-2 mt-3">
                          <span className="text-[28px] font-semibold text-black">0</span>
                          <span className="inline-flex items-center gap-1 bg-neutral-100 text-neutral-600 rounded-full px-2 py-0.5 text-[11px] font-medium">
                            {IconTrendingUp} 0
                          </span>
                        </div>
                        <p className="text-[11px] text-neutral-400 mt-1">Compared to yesterday</p>
                      </div>

                      <div className="mt-4">
                        <Gauge value={68} color="#9ca3af" showLabels={false} />
                      </div>

                      <div className="bg-neutral-100 rounded-full p-1 flex mt-4 text-xs font-medium">
                        <button className="flex-1 bg-white rounded-full py-1 text-center shadow-xs text-black">Video Clicks</button>
                        <button className="flex-1 text-neutral-500 py-1 text-center">Video Starts</button>
                      </div>
                    </div>

                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // MAIN MULTI-PAGE ROUTER APP
    // ==========================================

    const App = () => {
      // Pages: 'vex' -> 'forma' -> 'convix'
      const [currentPage, setCurrentPage] = useState('vex');

      if (currentPage === 'vex') {
        return <VexLanding onSignInSuccess={() => setCurrentPage('forma')} />;
      }

      if (currentPage === 'forma') {
        return <FormaDashboard onGoUnlimited={() => setCurrentPage('convix')} />;
      }

      return <ConvixSaaS />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
