<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a0510;
            --bg-light: #4a1528;
            --sakura-pink: #ffb7c5;
            --sakura-glow: #ff758c;
            --text-light: #ffe6eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-light), var(--bg-dark));
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SAKURA 3D PARTICLE SYSTEM --- */
        #sakura-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            perspective: 1000px;
        }

        .petal {
            position: absolute;
            background: linear-gradient(45deg, var(--sakura-pink), #fff);
            border-radius: 150px 0 150px 0;
            box-shadow: 0 0 10px var(--sakura-glow);
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translate3d(0, -50px, 0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { transform: translate3d(50px, 100vh, 100px) rotate(360deg) scale(0.5); opacity: 0; }
        }

        /* --- APP SCREENS --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 500px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 183, 197, 0.3);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255, 183, 197, 0.1);
            text-align: center;
            animation: fadeIn 0.8s ease forwards;
        }

        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h1, h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--sakura-pink);
            text-shadow: 0 0 15px var(--sakura-glow);
            margin-bottom: 20px;
        }
        h2 { font-size: 2.5rem; }

        input {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 15px;
            border-radius: 30px;
            border: 1px solid var(--sakura-glow);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.5); }

        button {
            background: linear-gradient(45deg, #ff4d6d, var(--sakura-glow));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: 0.3s;
            margin: 10px;
        }
        button:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6); }

        #error-msg { color: #ff4d6d; margin-top: 10px; font-size: 0.9rem; font-weight: 600; min-height: 20px; }

        /* --- QNA SECTION --- */
        .btn-group { display: flex; gap: 20px; justify-content: center; position: relative; width: 100%; height: 60px; margin-top: 20px; }
        #btn-yes { z-index: 2; }
        #btn-no { position: relative; z-index: 5; background: linear-gradient(45deg, #6c757d, #495057); box-shadow: none; }

        /* --- NOTES SECTION --- */
        .notes-container {
            display: flex; flex-direction: column; gap: 15px;
            max-height: 60vh; overflow-y: auto; padding-right: 10px;
            width: 100%;
        }
        .notes-container::-webkit-scrollbar { width: 5px; }
        .notes-container::-webkit-scrollbar-thumb { background: var(--sakura-glow); border-radius: 10px; }

        .note-card {
            background: rgba(255, 183, 197, 0.1);
            border-left: 4px solid var(--sakura-glow);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: left;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
            transform: translateX(-20px);
        }

        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }

        /* --- FINAL POPUP MODAL --- */
        #final-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-box {
            background: linear-gradient(135deg, var(--bg-light), var(--bg-dark));
            padding: 40px; border-radius: 20px; border: 2px solid var(--sakura-glow);
            text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 0 40px rgba(255, 117, 140, 0.4);
        }
    </style>
</head>
<body>

    <!-- 3D Sakura Background -->
    <div id="sakura-container"></div>

    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login" class="screen active">
        <h2>Birthday Gateway</h2>
        <p style="margin-bottom: 20px; font-size: 0.9rem; opacity: 0.8;">Enter your Date of Birth to enter</p>
        
        <input type="text" id="dob-input" placeholder="e.g. 2067.03.31">
        <button id="btn-check-dob" onclick="checkDOB()">Next</button>
        
        <div id="name-section" style="display: none; width: 100%; margin-top: 15px;">
            <input type="text" id="name-input" placeholder="What is your Name?">
            <button onclick="verifyLogin()">Let Me In</button>
        </div>
        
        <p id="error-msg"></p>
    </div>

    <!-- SCREEN 2: QnA -->
    <div id="screen-qna" class="screen">
        <h2 id="question-text">Are u in?</h2>
        <div class="btn-group">
            <button id="btn-yes" onclick="nextQuestion()">Yes!</button>
            <button id="btn-no" onmouseover="dodgeNo()" ontouchstart="dodgeNo()">No</button>
        </div>
    </div>

    <!-- SCREEN 3: BIRTHDAY NOTES -->
    <div id="screen-notes" class="screen">
        <h2>Happy Birthday! 🎂</h2>
        <div class="notes-container" id="notes-list">
            <!-- Notes injected via JS -->
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div id="final-modal">
        <div class="modal-box">
            <h2>Hey Beautiful! 🌸</h2>
            <p style="margin-bottom: 25px;">Are u happy? Wanna say something? <br><br><b>Happy Birthday to you once more! 🎉💖</b></p>
            <button onclick="closeModal()">Thank You!</button>
        </div>
    </div>

    <script>
        // --- 1. SAKURA GENERATION ---
        const sakuraContainer = document.getElementById('sakura-container');
        for (let i = 0; i < 40; i++) {
            let petal = document.createElement('div');
            petal.className = 'petal';
            let size = Math.random() * 15 + 10; // 10px to 25px
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.animationDuration = `${Math.random() * 5 + 4}s`;
            petal.style.animationDelay = `${Math.random() * 5}s`;
            // Fake 3D depth by varying blur and scale
            if (size < 15) { petal.style.filter = "blur(2px)"; petal.style.zIndex = "-1"; }
            sakuraContainer.appendChild(petal);
        }

        // --- 2. DATA & LOGIN LOGIC ---
        const friendsData = {
            "2067.03.31": "mahima",
            "2067.03.20": "anisha",
            "2067.10.27": "bigyan",
            "2068.02.27": "sayan",
            "2068.02.16": "chetan"
        };

        let currentValidName = "";
        let verifiedFriendName = "";

        function checkDOB() {
            // Normalize input replacing dashes with dots just in case
            let dobRaw = document.getElementById('dob-input').value.trim().replace(/-/g, '.');
            const errorMsg = document.getElementById('error-msg');
            
            if (friendsData[dobRaw]) {
                currentValidName = friendsData[dobRaw];
                errorMsg.innerText = "";
                document.getElementById('dob-input').style.display = "none";
                document.getElementById('btn-check-dob').style.display = "none";
                document.getElementById('name-section').style.display = "block";
            } else {
                errorMsg.innerText = "Error: DOB not found. Try again!";
            }
        }

        function verifyLogin() {
            let nameIn = document.getElementById('name-input').value.trim().toLowerCase();
            const errorMsg = document.getElementById('error-msg');
            
            if (nameIn === currentValidName) {
                verifiedFriendName = nameIn.charAt(0).toUpperCase() + nameIn.slice(1);
                switchScreen('screen-qna');
            } else {
                errorMsg.innerText = "Error: Name doesn't match this DOB!";
            }
        }

        // --- 3. QnA LOGIC & DODGING BUTTON ---
        const questions = [
            "Are u in?",
            "Will u accept my gift?",
            "Are u happy?",
            "We are almost there?"
        ];
        let qIndex = 0;

        function nextQuestion() {
            qIndex++;
            if (qIndex < questions.length) {
                document.getElementById('question-text').innerText = questions[qIndex];
                // Reset No button position just in case
                const btnNo = document.getElementById('btn-no');
                btnNo.style.position = "relative";
                btnNo.style.left = "0";
                btnNo.style.top = "0";
            } else {
                showNotes();
            }
        }

        function dodgeNo() {
            const btnNo = document.getElementById('btn-no');
            const container = document.querySelector('#screen-qna');
            
            // Randomize position within the boundaries
            const maxX = container.offsetWidth - btnNo.offsetWidth - 20;
            const maxY = 150; // Bound Y movement
            
            const randomX = Math.floor(Math.random() * maxX) - (maxX / 2);
            const randomY = Math.floor(Math.random() * maxY) - 50;

            btnNo.style.position = 'absolute';
            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        // --- 4. NOTES SECTION ---
        const notes = [
            "1. Wishing you a day filled with happiness and a year filled with joy.",
            "2. You are one of the most amazing people I know.",
            "3. May all your beautiful dreams come true this year.",
            "4. Thank you for being such an incredible friend.",
            "5. Never stop smiling, because your smile lights up the room!",
            "6. I hope today brings you as much joy as you bring to everyone else."
        ];

        function showNotes() {
            switchScreen('screen-notes');
            document.querySelector('#screen-notes h2').innerText = `Happy Birthday, ${verifiedFriendName}! 🎂`;
            
            const list = document.getElementById('notes-list');
            list.innerHTML = "";
            
            // Stagger animation for notes
            notes.forEach((note, index) => {
                let div = document.createElement('div');
                div.className = 'note-card';
                div.innerText = note;
                div.style.animationDelay = `${index * 0.4}s`;
                list.appendChild(div);
            });

            // Trigger final modal after reading time (7 seconds)
            setTimeout(() => {
                document.getElementById('final-modal').style.display = 'flex';
            }, 7000);
        }

        // --- 5. UTILS ---
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function closeModal() {
            document.getElementById('final-modal').style.display = 'none';
        }
    </script>
</body>
</html>
